name: Release

# On a published GitHub release: build the .vsix, attach it to the release and
# publish it to the VS Code Marketplace through Trusted Publishing (OIDC), so no
# Marketplace token is stored. Run it by hand to publish the current main.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Attach to the GitHub release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" *.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --oidc --skip-duplicate --packagePath *.vsix
